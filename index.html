    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Open Close Radar",
        "url": "https://openclose.jp/",
        "inLanguage": "ja",
        "description": "地域の開店、閉店、移転、休業、リニューアル情報を探せる速報サービス。",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://openclose.jp/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Open Close Radarとは？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "地域の開店、閉店、移転、休業、リニューアル情報を、投稿と確認ステータスつきで探せるサービスです。"
            }
          },
          {
            "@type": "Question",
            "name": "UGCでは何を集めますか？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "店名、住所、ジャンル、開店日、閉店日、張り紙、公式SNS、写真、現地確認、代替店情報を集めます。"
            }
          },
          {
            "@type": "Question",
            "name": "収益導線は何ですか？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "新店広告、求人、テナント募集、周辺店舗送客、確認済み掲載、地域スポンサー、クーポンで収益化します。"
            }
          }
        ]
      }
    </script>
